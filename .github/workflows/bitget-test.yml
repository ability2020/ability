name: Bitget Demo Bot Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run paper-only market monitoring every 15 minutes (UTC).
    - cron: "*/15 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
      BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
      BITGET_SYMBOL: BTCUSDT
      BITGET_INTERVAL: 5m
      TRADE_AMOUNT_USDT: "10"
      CANDLE_LOOKBACK_DAYS: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline safety unit tests
        run: python -m unittest discover -s tests -v

      - name: Train and evaluate experimental learning model (no orders)
        run: python learning_model.py

      - name: Check Bitget credentials
        run: |
          python - <<'PY'
          import os
          missing = [
              name for name in (
                  "BITGET_API_KEY",
                  "BITGET_SECRET_KEY",
                  "BITGET_PASSPHRASE",
              )
              if not os.getenv(name)
          ]
          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )
          print("Bitget credentials are present.")
          PY

      - name: Test Bitget connection
        run: |
          python - <<'PY'
          import time
          import main

          print("Testing public market data...")
          candles = main.get_candles()
          ticker = main.get_ticker()

          print("Candles received:", len(candles))
          print("BTCUSDT last price:", ticker.get("lastPrice"))

          print("Testing authenticated account access...")
          main.private_request("GET", "/api/v3/account/assets")
          print("Authenticated account request: SUCCESS")

          main.get_available_balance("USDT")
          main.get_available_balance("BTC")
          print("USDT balance check: SUCCESS")
          print("BTC balance check: SUCCESS")
          print("Balance values are intentionally not printed.")

          print("Testing indicator strategy (signal-only)...")
          signal, signal_price, details = main.get_signal()
          if signal not in ("BUY", "SELL", "WAIT"):
              raise SystemExit("Unexpected signal: " + str(signal))
          if signal_price is None or signal_price <= 0:
              raise SystemExit("Signal test did not return a valid price.")
          print("Indicator signal:", signal)
          if "indicator_score" in details:
              print("Indicator score:", details["indicator_score"])
              print("RSI-14:", round(details["rsi_14"], 2))
          else:
              print("Indicator note:", details.get("reason", "Indicators unavailable"))
              raise SystemExit("Indicator test did not calculate indicators.")

          print("Testing decision-only risk engine...")
          buy_details = {"indicator_score": 2}
          decision, reason = main.evaluate_risk("BUY", 100.0, buy_details, 20.0, 0.0)
          if decision != "BUY_CANDIDATE":
              raise SystemExit("Risk engine rejected a valid test BUY candidate: " + reason)

          decision, reason = main.evaluate_risk("BUY", 100.0, buy_details, 0.0, 0.0)
          if decision != "WAIT":
              raise SystemExit("Risk engine failed to block BUY with insufficient USDT.")

          sell_details = {"indicator_score": -2}
          decision, reason = main.evaluate_risk("SELL", 100.0, sell_details, 20.0, 0.0)
          if decision != "WAIT":
              raise SystemExit("Risk engine failed to block SELL without BTC.")

          decision, reason = main.evaluate_risk("BUY", float("nan"), buy_details, 20.0, 0.0)
          if decision != "WAIT":
              raise SystemExit("Risk engine failed to block non-finite prices.")

          print("Testing persistent state validation...")
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp_dir:
              state_path = str(Path(temp_dir) / "state.json")
              initial_state = main.load_position_state(state_path)
              if initial_state["position"] is not None:
                  raise SystemExit("Fresh state should have no tracked position.")
              test_state = {
                  "version": 1,
                  "position": {"entry_price": 100.0, "quantity": 0.01},
                  "last_order_ids": ["demo_test_order"],
              }
              main.save_position_state(test_state, state_path)
              if main.load_position_state(state_path) != test_state:
                  raise SystemExit("Position state round-trip test failed.")
              try:
                  main.save_position_state({
                      "version": 1,
                      "position": {"entry_price": float("nan"), "quantity": 0.01},
                      "last_order_ids": [],
                  }, state_path)
              except ValueError:
                  pass
              else:
                  raise SystemExit("State validation failed to reject a non-finite entry price.")
          print("Persistent state validation: PASSED")

          print("Testing decision-only stop-loss/take-profit checks...")
          decision, _ = main.evaluate_position_exit(100.0, 97.0)
          if decision != "STOP_LOSS_CANDIDATE":
              raise SystemExit("Stop-loss threshold test failed.")
          decision, _ = main.evaluate_position_exit(100.0, 104.0)
          if decision != "TAKE_PROFIT_CANDIDATE":
              raise SystemExit("Take-profit threshold test failed.")
          decision, _ = main.evaluate_position_exit(100.0, 101.0)
          if decision != "HOLD":
              raise SystemExit("Hold-range test failed.")

          first_id = main.make_client_order_id("buy", time_bucket=12345)
          second_id = main.make_client_order_id("buy", time_bucket=12345)
          if first_id != second_id:
              raise SystemExit("Deterministic duplicate-order ID test failed.")
          if first_id == main.make_client_order_id("sell", time_bucket=12345):
              raise SystemExit("BUY and SELL client order IDs must differ.")

          print("Risk, stop-loss, take-profit and order-ID tests: PASSED")
          print("Bitget connection, balance, indicator and risk tests: PASSED")
          print("No order was placed by this test.")
          PY

      - name: Restore bot position state
        uses: actions/cache/restore@v5
        with:
          path: |
            bot_state.json
            paper_state.json
          key: bitget-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bitget-bot-state-${{ github.ref_name }}-

      - name: Run bot signal check (one cycle, no orders)
        run: python main.py --once

      - name: Run paper-trading simulation (no exchange orders)
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          import main
          import paper_trader

          signal, signal_price, details = main.get_signal()
          ticker = main.get_ticker()
          price = float(ticker["lastPrice"])
          usdt_balance = main.get_available_balance("USDT")
          btc_balance = main.get_available_balance("BTC")
          risk_decision, risk_reason = main.evaluate_risk(
              signal, price, details, usdt_balance, btc_balance
          )
          state = paper_trader.load_state()
          paper_signal = paper_trader.risk_gated_paper_signal(signal, risk_decision)
          updated, event, reason = paper_trader.process_cycle(
              state,
              paper_signal,
              price,
              trade_amount_usdt=main.TRADE_AMOUNT_USDT,
              stop_loss_percent=main.STOP_LOSS_PERCENT,
              take_profit_percent=main.TAKE_PROFIT_PERCENT,
          )
          paper_trader.save_state(updated)

          def safe_number(value):
              try:
                  number = float(value)
                  return number if number == number and abs(number) != float("inf") else None
              except (TypeError, ValueError):
                  return None

          signal_record = {
              "record_type": "actual-market-signal-paper-only",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "symbol": main.SYMBOL,
              "interval": main.INTERVAL,
              "signal": signal,
              "signal_price": safe_number(signal_price),
              "ticker_price": price,
              "indicator_score": details.get("indicator_score"),
              "sma_9": safe_number(details.get("fast_sma")),
              "sma_21": safe_number(details.get("slow_sma")),
              "rsi_14": safe_number(details.get("rsi_14")),
              "signal_reason": details.get("reason"),
              "risk_decision": risk_decision,
              "risk_reason": risk_reason,
              "risk_decision_scope": "BUY entries require BUY_CANDIDATE; SELL may close an existing hypothetical paper position because real BTC balance is separate from simulated holdings.",
              "paper_trading_mode": "Risk-gated hypothetical position; no exchange order is sent.",
              "paper_signal": paper_signal,
              "paper_event": event,
              "paper_event_reason": reason,
              "simulated_realized_pnl_usdt_gross": updated["realized_pnl_usdt"],
              "closed_trade_count": len(updated["closed_trades"]),
              "open_position": updated["position"],
              "note": "Signal from retrieved market data. Hypothetical BUY entries are blocked unless the risk engine returns BUY_CANDIDATE. A SELL signal can close an existing simulated position independently of real BTC holdings. No exchange order was sent."
          }
          with open("paper_signal.json", "w", encoding="utf-8") as file:
              json.dump(signal_record, file, indent=2, allow_nan=False)

          print("PAPER-TRADING ONLY — no Bitget order endpoint called.")
          print("Market indicator signal:", signal)
          print("Exchange-account risk candidate:", risk_decision, "—", risk_reason)
          print("Risk-gated paper signal:", paper_signal)
          print("Paper BUY entries require BUY_CANDIDATE; paper SELL can close an existing simulated position.")
          print("Paper event:", event)
          print("Reason:", reason)
          print("Simulated realized PnL (USDT):", round(updated["realized_pnl_usdt"], 6))
          print("Simulated position open:", updated["position"] is not None)
          print("Closed simulated trades recorded:", len(updated["closed_trades"]))
          print("Actual market signal record created: paper_signal.json")
          PY

      - name: Create paper-trading performance report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          import paper_trader

          state = paper_trader.load_state()
          try:
              with open("paper_signal.json", "r", encoding="utf-8") as file:
                  latest_signal = json.load(file)
          except (OSError, json.JSONDecodeError):
              latest_signal = None
          try:
              with open("ml_report.json", "r", encoding="utf-8") as file:
                  learning_report = json.load(file)
          except (OSError, json.JSONDecodeError):
              learning_report = None
          try:
              with open("walk_forward_report.json", "r", encoding="utf-8") as file:
                  walk_forward_report = json.load(file)
          except (OSError, json.JSONDecodeError):
              walk_forward_report = None

          fee_rate = 0.001
          slippage_rate = 0.0005
          recorded_closed_gross = 0.0
          recorded_closed_costs = 0.0
          recorded_closed_trades = []
          for trade in state["closed_trades"]:
              entry = float(trade["entry_price"])
              exit_price = float(trade["exit_price"])
              quantity = float(trade["quantity"])
              gross = float(trade["pnl_usdt"])
              entry_fee = entry * quantity * fee_rate
              exit_fee = exit_price * quantity * fee_rate
              entry_slippage = entry * quantity * slippage_rate
              exit_slippage = exit_price * quantity * slippage_rate
              costs = entry_fee + exit_fee + entry_slippage + exit_slippage
              recorded_closed_gross += gross
              recorded_closed_costs += costs
              recorded_closed_trades.append({
                  **trade,
                  "estimated_entry_fee_usdt": entry_fee,
                  "estimated_exit_fee_usdt": exit_fee,
                  "estimated_entry_slippage_usdt": entry_slippage,
                  "estimated_exit_slippage_usdt": exit_slippage,
                  "estimated_total_costs_usdt": costs,
                  "estimated_net_pnl_usdt": gross - costs,
              })

          open_position = state["position"]
          current_price = None
          if isinstance(latest_signal, dict):
              try:
                  current_price = float(latest_signal.get("ticker_price"))
              except (TypeError, ValueError):
                  current_price = None
          unrealized = None
          if isinstance(open_position, dict) and current_price is not None and current_price > 0:
              entry = float(open_position["entry_price"])
              quantity = float(open_position["quantity"])
              gross = (current_price - entry) * quantity
              entry_fee = entry * quantity * fee_rate
              exit_fee = current_price * quantity * fee_rate
              entry_slippage = entry * quantity * slippage_rate
              exit_slippage = current_price * quantity * slippage_rate
              costs = entry_fee + exit_fee + entry_slippage + exit_slippage
              unrealized = {
                  "mark_price": current_price,
                  "gross_pnl_usdt": gross,
                  "estimated_entry_fee_usdt": entry_fee,
                  "estimated_exit_fee_usdt": exit_fee,
                  "estimated_entry_slippage_usdt": entry_slippage,
                  "estimated_exit_slippage_usdt": exit_slippage,
                  "estimated_total_costs_usdt": costs,
                  "estimated_net_pnl_usdt": gross - costs,
                  "cost_assumptions": "0.10% fee and 0.05% slippage per side; estimates only",
              }

          report = {
              "report_type": "paper-trading-only-with-market-signal",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.getenv("GITHUB_RUN_ID"),
              "github_run_number": os.getenv("GITHUB_RUN_NUMBER"),
              "symbol": os.getenv("BITGET_SYMBOL", "BTCUSDT"),
              "interval": os.getenv("BITGET_INTERVAL", "5m"),
              "latest_market_signal": latest_signal,
              "experimental_learning_model": learning_report,
              "walk_forward_evaluation": walk_forward_report,
              "realized_pnl_usdt_gross": state["realized_pnl_usdt"],
              "recorded_closed_trades_gross_pnl_usdt": recorded_closed_gross,
              "recorded_closed_trades_estimated_costs_usdt": recorded_closed_costs,
              "recorded_closed_trades_estimated_net_pnl_usdt": recorded_closed_gross - recorded_closed_costs,
              "closed_trade_count": len(state["closed_trades"]),
              "open_position": open_position,
              "open_position_unrealized_pnl": unrealized,
              "closed_trades": recorded_closed_trades,
              "cost_assumptions": {
                  "fee_rate_each_side": fee_rate,
                  "slippage_rate_each_side": slippage_rate,
                  "note": "Estimated costs are not actual Bitget fills. Closed-trade estimates cover the trades retained in paper state; cumulative gross realized PnL may include older trades no longer retained.",
              },
              "note": "Simulated results only. Paper positions are hypothetical and independent of real exchange balances. No exchange order is sent. Gross and estimated net PnL are reported separately.",
          }
          with open("paper_report.json", "w", encoding="utf-8") as file:
              json.dump(report, file, indent=2, allow_nan=False)
          print("Paper-trading report created.")
          print("Closed simulated trades:", report["closed_trade_count"])
          print("Simulated realized PnL (USDT):", round(report["realized_pnl_usdt_gross"], 6))
          print("This report contains simulated trading data only.")
          PY

      - name: Demonstrate a synthetic paper trade (offline only)
        run: |
          python - <<'PY'
          import paper_trader

          state = paper_trader.default_state()
          state, buy_event, _ = paper_trader.process_cycle(
              state, "BUY", 100.0, trade_amount_usdt=10.0,
              stop_loss_percent=2.0, take_profit_percent=3.0,
          )
          state, sell_event, reason = paper_trader.process_cycle(
              state, "WAIT", 103.0, trade_amount_usdt=10.0,
              stop_loss_percent=2.0, take_profit_percent=3.0,
          )
          trade = state["closed_trades"][-1]
          print("SYNTHETIC EXAMPLE ONLY — these are not live prices or a real trade.")
          print("Hypothetical entry event:", buy_event)
          print("Hypothetical exit event:", sell_event)
          print("Exit reason:", reason)
          print("Example gross PnL before fees/slippage (USDT):", round(trade["pnl_usdt"], 6))
          print("Example realized PnL total (USDT):", round(state["realized_pnl_usdt"], 6))
          print("Closed example trades:", len(state["closed_trades"]))
          print("Open example position:", state["position"] is not None)
          if buy_event != "PAPER_BUY" or sell_event != "PAPER_SELL":
              raise SystemExit("Synthetic paper-trade lifecycle did not complete.")
          if trade["exit_reason"] != "TAKE_PROFIT" or abs(trade["pnl_usdt"] - 0.3) > 1e-9:
              raise SystemExit("Synthetic paper-trade results did not match expectations.")
          PY

      - name: Save bot position state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            bot_state.json
            paper_state.json
          key: bitget-bot-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload paper-trading report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paper-trading-report-run-${{ github.run_number }}
          path: |
            paper_report.json
            paper_signal.json
            ml_report.json
            walk_forward_report.json
            multi_period_report.json
            feature_ablation_report.json
            model_selection_report.json
          if-no-files-found: warn
          retention-days: 30


  historical-research:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        interval: [5m, 1H, 4H]
    env:
      BITGET_SYMBOL: BTCUSDT
      BITGET_INTERVAL: ${{ matrix.interval }}
      CANDLE_LOOKBACK_DAYS: "30"
      CANDLE_END_OFFSET_DAYS: "300"
      BACKTEST_STAKE_USDT: "10"
      BACKTEST_FEE_RATE: "0.001"
      BACKTEST_SLIPPAGE_RATE: "0.0005"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compare baseline and expanded features chronologically (no orders)
        run: python feature_ablation.py

      - name: Select model and threshold on validation data; test on untouched holdout (no orders)
        run: python model_selection.py

      - name: Walk-forward backtest with estimated fees and slippage (no orders)
        run: python walk_forward_backtest.py

      - name: Validate bullish-regime filter across three independent windows (no orders)
        run: python multi_window_validation.py

      - name: Upload historical research reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: historical-research-${{ matrix.interval }}-run-${{ github.run_number }}
          path: |
            feature_ablation_report.json
            model_selection_report.json
            walk_forward_report.json
            multi_window_validation_report.json
          if-no-files-found: warn
          retention-days: 30


  publish-reports:
    needs: test
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-reports
      cancel-in-progress: false
    steps:
      - name: Check out reports branch
        uses: actions/checkout@v6
        with:
          ref: reports

      - name: Download this run's report files
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: paper-trading-report-run-${{ github.run_number }}
          path: latest

      - name: Commit and push reports
        run: |
          mkdir -p latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latest
          if git diff --cached --quiet; then
            echo "No report changes to publish."
          else
            git commit -m "Reports from run ${{ github.run_number }}"
            git push origin reports
          fi
