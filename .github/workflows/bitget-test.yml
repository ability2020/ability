name: Bitget Demo Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
      BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
      BITGET_SYMBOL: BTCUSDT
      BITGET_INTERVAL: 5m
      TRADE_AMOUNT_USDT: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline safety unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Bitget credentials
        run: |
          python - <<'PY'
          import os
          missing = [
              name for name in (
                  "BITGET_API_KEY",
                  "BITGET_SECRET_KEY",
                  "BITGET_PASSPHRASE",
              )
              if not os.getenv(name)
          ]
          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )
          print("Bitget credentials are present.")
          PY

      - name: Test Bitget connection
        run: |
          python - <<'PY'
          import json
          import time
          import main

          print("Testing public market data...")
          candles = main.get_candles()
          ticker = main.get_ticker()

          print("Candles received:", len(candles))
          print("BTCUSDT last price:", ticker.get("lastPrice"))

          print("Testing authenticated account access...")
          assets = main.private_request("GET", "/api/v3/account/assets")
          print("Authenticated account request: SUCCESS")

          usdt = main.get_available_balance("USDT")
          btc = main.get_available_balance("BTC")
          print("USDT balance check: SUCCESS")
          print("BTC balance check: SUCCESS")
          print("Balance values are intentionally not printed.")

          # Do not print balances or API credentials into GitHub logs.
          print("Testing indicator strategy (signal-only)...")
          signal, signal_price, details = main.get_signal()
          if signal not in ("BUY", "SELL", "WAIT"):
              raise SystemExit("Unexpected signal: " + str(signal))
          if signal_price is None or signal_price <= 0:
              raise SystemExit("Signal test did not return a valid price.")
          print("Indicator signal:", signal)
          if "indicator_score" in details:
              print("Indicator score:", details["indicator_score"])
              print("RSI-14:", round(details["rsi_14"], 2))
          else:
              print("Indicator note:", details.get("reason", "Indicators unavailable"))
              raise SystemExit("Indicator test did not calculate indicators.")

          print("Testing decision-only risk engine...")
          buy_details = {"indicator_score": 2}
          decision, reason = main.evaluate_risk("BUY", 100.0, buy_details, 20.0, 0.0)
          if decision != "BUY_CANDIDATE":
              raise SystemExit("Risk engine rejected a valid test BUY candidate: " + reason)

          decision, reason = main.evaluate_risk("BUY", 100.0, buy_details, 0.0, 0.0)
          if decision != "WAIT":
              raise SystemExit("Risk engine failed to block BUY with insufficient USDT.")

          sell_details = {"indicator_score": -2}
          decision, reason = main.evaluate_risk("SELL", 100.0, sell_details, 20.0, 0.0)
          if decision != "WAIT":
              raise SystemExit("Risk engine failed to block SELL without BTC.")

          decision, reason = main.evaluate_risk("BUY", float("nan"), buy_details, 20.0, 0.0)
          if decision != "WAIT":
              raise SystemExit("Risk engine failed to block non-finite prices.")

          print("Testing persistent state validation...")
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp_dir:
              state_path = str(Path(temp_dir) / "state.json")
              initial_state = main.load_position_state(state_path)
              if initial_state["position"] is not None:
                  raise SystemExit("Fresh state should have no tracked position.")
              test_state = {
                  "version": 1,
                  "position": {"entry_price": 100.0, "quantity": 0.01},
                  "last_order_ids": ["demo_test_order"],
              }
              main.save_position_state(test_state, state_path)
              if main.load_position_state(state_path) != test_state:
                  raise SystemExit("Position state round-trip test failed.")
              try:
                  main.save_position_state({
                      "version": 1,
                      "position": {"entry_price": float("nan"), "quantity": 0.01},
                      "last_order_ids": [],
                  }, state_path)
              except ValueError:
                  pass
              else:
                  raise SystemExit("State validation failed to reject a non-finite entry price.")
          print("Persistent state validation: PASSED")

          print("Testing decision-only stop-loss/take-profit checks...")
          decision, _ = main.evaluate_position_exit(100.0, 97.0)
          if decision != "STOP_LOSS_CANDIDATE":
              raise SystemExit("Stop-loss threshold test failed.")
          decision, _ = main.evaluate_position_exit(100.0, 104.0)
          if decision != "TAKE_PROFIT_CANDIDATE":
              raise SystemExit("Take-profit threshold test failed.")
          decision, _ = main.evaluate_position_exit(100.0, 101.0)
          if decision != "HOLD":
              raise SystemExit("Hold-range test failed.")

          first_id = main.make_client_order_id("buy", time_bucket=12345)
          second_id = main.make_client_order_id("buy", time_bucket=12345)
          if first_id != second_id:
              raise SystemExit("Deterministic duplicate-order ID test failed.")
          if first_id == main.make_client_order_id("sell", time_bucket=12345):
              raise SystemExit("BUY and SELL client order IDs must differ.")

          print("Risk, stop-loss, take-profit and order-ID tests: PASSED")
          print("Bitget connection, balance, indicator and risk tests: PASSED")
          print("No order was placed by this test.")
          PY

      - name: Restore bot position state
        uses: actions/cache/restore@v4
        with:
          path: |
            bot_state.json
            paper_state.json
          key: bitget-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bitget-bot-state-${{ github.ref_name }}-

      - name: Run bot signal check (one cycle, no orders)
        run: python main.py --once

      - name: Run paper-trading simulation (no exchange orders)
        run: |
          python - <<'PY'
          import main
          import paper_trader

          signal, _, details = main.get_signal()
          ticker = main.get_ticker()
          price = float(ticker["lastPrice"])
          state = paper_trader.load_state()
          updated, event, reason = paper_trader.process_cycle(
              state,
              signal,
              price,
              trade_amount_usdt=main.TRADE_AMOUNT_USDT,
              stop_loss_percent=main.STOP_LOSS_PERCENT,
              take_profit_percent=main.TAKE_PROFIT_PERCENT,
          )
          paper_trader.save_state(updated)
          print("PAPER-TRADING ONLY — no Bitget order endpoint called.")
          print("Signal:", signal)
          print("Paper event:", event)
          print("Reason:", reason)
          print("Simulated realized PnL (USDT):", round(updated["realized_pnl_usdt"], 6))
          print("Simulated position open:", updated["position"] is not None)
          print("Closed simulated trades recorded:", len(updated["closed_trades"]))
          PY

      - name: Demonstrate a synthetic paper trade (offline only)
        run: |
          python - <<'PY'
          import paper_trader

          state = paper_trader.default_state()
          state, buy_event, _ = paper_trader.process_cycle(
              state, "BUY", 100.0, trade_amount_usdt=10.0,
              stop_loss_percent=2.0, take_profit_percent=3.0,
          )
          state, sell_event, reason = paper_trader.process_cycle(
              state, "WAIT", 103.0, trade_amount_usdt=10.0,
              stop_loss_percent=2.0, take_profit_percent=3.0,
          )
          trade = state["closed_trades"][-1]
          print("SYNTHETIC EXAMPLE ONLY — these are not live prices or a real trade.")
          print("Hypothetical entry event:", buy_event)
          print("Hypothetical exit event:", sell_event)
          print("Exit reason:", reason)
          print("Example gross PnL before fees/slippage (USDT):", round(trade["pnl_usdt"], 6))
          print("Example realized PnL total (USDT):", round(state["realized_pnl_usdt"], 6))
          print("Closed example trades:", len(state["closed_trades"]))
          print("Open example position:", state["position"] is not None)
          if buy_event != "PAPER_BUY" or sell_event != "PAPER_SELL":
              raise SystemExit("Synthetic paper-trade lifecycle did not complete.")
          if trade["exit_reason"] != "TAKE_PROFIT" or abs(trade["pnl_usdt"] - 0.3) > 1e-9:
              raise SystemExit("Synthetic paper-trade results did not match expectations.")
          PY

      - name: Save bot position state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot_state.json
            paper_state.json
          key: bitget-bot-state-${{ github.ref_name }}-${{ github.run_id }}
