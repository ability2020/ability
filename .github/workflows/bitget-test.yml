name: Bitget Demo Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_SECRET_KEY: ${{ secrets.BITGET_SECRET_KEY }}
      BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
      BITGET_SYMBOL: BTCUSDT
      BITGET_INTERVAL: 5m
      TRADE_AMOUNT_USDT: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Bitget credentials
        run: |
          python - <<'PY'
          import os
          missing = [
              name for name in (
                  "BITGET_API_KEY",
                  "BITGET_SECRET_KEY",
                  "BITGET_PASSPHRASE",
              )
              if not os.getenv(name)
          ]
          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )
          print("Bitget credentials are present.")
          PY

      - name: Test Bitget connection
        run: |
          python - <<'PY'
          import json
          import main

          print("Testing public market data...")
          candles = main.get_candles()
          ticker = main.get_ticker()

          print("Candles received:", len(candles))
          print("BTCUSDT last price:", ticker.get("lastPrice"))

          print("Testing authenticated account access...")
          assets = main.private_request("GET", "/api/v3/account/assets")
          print("Authenticated account request: SUCCESS")

          usdt = main.get_available_balance("USDT")
          btc = main.get_available_balance("BTC")
          print("USDT balance check: SUCCESS")
          print("BTC balance check: SUCCESS")
          print("Balance values are intentionally not printed.")

          # Do not print balances or API credentials into GitHub logs.
          print("Bitget Demo connection and balance test: PASSED")
          print("No order was placed by this test.")
          PY
